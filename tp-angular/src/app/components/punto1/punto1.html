<div class="container text-center">
    <h2>Punto 1</h2>
    <h2 class="text-center mb-4">Eventos Destacados</h2>

    <div class="card bg-dark text-white">

        <img [src] = 'eventos[index].src'
            class="card-img" alt="Imagen del evento" style="max-height: 400px; object-fit: cover; ">

        <div class="card-img-overlay d-flex flex-column justify-content-end pb-4" style="background: rgba(0,0,0,0.5);">
            <h3 class="card-title">{{eventos[index].nombre}}</h3>
            <p class="card-text"> {{eventos[index].desc}} </p>
        </div>

        <button class="btn btn-danger position-absolute top-50 start-0 translate-middle-y ms-3" (click)="anterior()">
            <i class="bi bi-chevron-left"></i>
        </button>

        <button class="btn btn-danger position-absolute top-50 end-0 translate-middle-y me-3" (click)="siguiente()">
            <i class="bi bi-chevron-right"></i>
        </button>
    </div>
</div>
