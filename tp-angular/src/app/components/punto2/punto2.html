<div class="container mt-3 mb-4">
    <div class="cards-container">
        <div class="row">
            <div class="col-sm-4 mb-4" *ngFor="let p of productos">
                <div class="card" style="width: 18rem;">
                    <img [src]="p.img" class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">{{p.nombre}}</h5>
                        <p class="card-text">{{p.desc}}</p>
                        <a class="btn btn-primary" (click)="agregarAlCarrito(p)">Agregar al Carrito</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button type="button" class="btn btn-success mt-3" data-bs-toggle="modal" data-bs-target="#exampleModal">
        <i class="bi bi-cart4"></i> Carrito
    </button>

    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <ul>
                        <li *ngFor="let p of carrito.productos">
                            {{p.nombre}} - ${{p.precio}}
                        </li>
                    </ul>
                    <p>
                        @if (carrito.total <= 0){ Carrito Vacio } @else { Total: ${{carrito.total}} } </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>
</div>
