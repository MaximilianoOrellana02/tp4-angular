<div class="container text-center mt-5">
    <h1 class="mb-4">Juego de la Memoria</h1>
    <div class="mb-4 b-light p-3">
        <button class="btn btn-success me-2" (click)="iniciarJuego()" *ngIf="!juegoIniciado">Iniciar Juego</button>
        <button class="btn btn-warning" (click)="reiniciarJuego()" *ngIf="juegoIniciado">Reiniciar</button>

        <span class="ms-4" ngClass="{'text-danger': intentosRestantes <= 3}" *ngIf="juegoIniciado">
            Intentos Restantes: {{ intentosRestantes }}
        </span>
    </div>

    <div class="mb-4" *ngIf="juegoIniciado && !juegoTerminado">
        <button class="btn btn-primary" (click)="habilitarIntento()" [disabled]="puedeVoltear || flippedCards.length > 0">INTENTAR</button>
        <p class="text-success mt-2 fw-bold" *ngIf="puedeVoltear">¡Selecciona dos Cartas!</p>
    </div>

    <div class="alert" [ngClass]="{'alert-succes': intentosRestantes > 0, 'alert-danger': intentosRestantes <= 0 }" *ngIf="juegoTerminado">
        <h3>{{mensajeFinal}}</h3>
    </div>

    <div class="row justify-content-center">
        @for (c of cards; track c.id) {
            <div class="col-6 col-md-4 col-lg-2 mb-4">
                <div class="card-container" (click)="toggleFlip(c)" [class.flipped]="c.isFlipped">
                    <div class="card-inner">

                        <div class="card-front">
                            <img src="https://img.magnific.com/vector-gratis/vector-tipografia-estilo-basura-trazo-pincel-signo-interrogacion_53876-140880.jpg?semt=ais_hybrid&w=740&q=80" alt="Carta Tapada" class="img-fluid rounded" style="width: 100%; height: 100%; object-fit: cover;">
                        </div>
                        <div class="card-back d-flex align-items-center justify-content-center bg-white border rounded">
                            <img [src]="c.src" alt="Carta Revelada" class="img-fluid rounded" style="width: 100%; height: 100%; object-fit: cover;">
                        </div>
                    </div>
                </div>
            </div>
        }
    </div>
</div>
